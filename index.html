<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 연결 실습</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        /* 상단 메뉴바 스타일 */
        nav {
            border-top: 1px solid #aaa;
            border-bottom: 1px solid #aaa;
            padding: 10px 0;
            margin-bottom: 30px;
        }
        nav a {
            color: blue;
            text-decoration: underline;
            margin: 0 5px;
        }
        /* 방명록 영역 스타일 */
        #guestbook-section {
            max-width: 800px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 메뉴 -->
    <nav>
        <!-- GitHub 이슈 게시판 링크 -->
        <a href="https://github.com/chaehyun040224/finalweb/issues" target="_blank">이슈 게시판 이동</a> | 
        <!-- 방명록 영역으로 이동하는 앵커 링크 -->
        <a href="#guestbook-section">방명록 이동</a>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <main>
        <h1>웹페이지 첫 화면입니다</h1>
        <p>상단 메뉴를 통해 GitHub 이슈 게시판을 방문하거나, 아래로 스크롤하여 방명록을 남길 수 있습니다.</p>
    </main>

    <hr>

    <!-- giscus 방명록 영역 -->
    <section id="guestbook-section">
        <h2>방명록</h2>
        <p>GitHub 계정으로 로그인하여 댓글 및 방명록을 남겨보세요.</p>

        <!-- ▼▼▼ giscus.app에서 발급받은 스크립트 코드를 아래에 붙여넣으세요 ▼▼▼ -->
        <script src="https://giscus.app/client.js"
                data-repo="chaehyun040224/finalweb"
                data-repo-id="[여기에_발급받은_REPO_ID_입력]"
                data-category="General"
                data-category-id="[여기에_발급받은_CATEGORY_ID_입력]"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="bottom"
                data-theme="light"
                data-lang="ko"
                crossorigin="anonymous"
                async>
        </script>
        <!-- ▲▲▲ giscus 스크립트 끝 ▲▲▲ -->
    </section>

</body>
</html>
